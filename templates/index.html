<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reporte Cripto</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        h2 { color: #555; margin-top: 40px; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th { background-color: #4F81BD; color: white; padding: 10px; }
        td { padding: 10px; border: 1px solid #ddd; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .graficos { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .graficos img { width: 48%; border: 1px solid #ddd; background: white; }
        .descargas { margin-top: 30px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; background: #4F81BD; color: white;
               text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #3a6a9e; }
    </style>
</head>
<body>
    <h1>Reporte de Criptomonedas</h1>
    <p>Actualizado: {{ fecha }}</p>

    <table>
        <tr>
            <th>Criptomoneda</th>
            <th>Precio USD</th>
            <th>Variación %</th>
        </tr>
        {% for item in reporte %}
        <tr>
            <td>{{ item.nombre }}</td>
            <td>{{ item.precio }}</td>
            <td>{{ item.variacion if item.variacion is not none else "N/A" }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Gráficos</h2>
    <div class="graficos">
        <img src="/grafico/actual" alt="Precios actuales">
        <img src="/grafico/historico" alt="Historial de precios">
    </div>

    <h2>Descargar reporte</h2>
    <div class="descargas">
        <a href="/descargar/excel" class="btn">Excel</a>
        <a href="/descargar/csv" class="btn">CSV</a>
        <a href="/descargar/pdf" class="btn">PDF</a>
    </div>
</body>
</html>
